<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>ZCode</title><link rel="stylesheet" href="http://127.0.0.1:7396/embed.css"/><script src="http://127.0.0.1:7396/embed.js" defer></script>
    <style>
      /* 复刻 ZCode 暗色主题 token + DSH 式行级结构 */
      :root { --color-neutral-900:#171717; --color-neutral-950:#0a0a0a; }
      .dark { --color-background: var(--color-neutral-900); --color-background-alt: #26262699; --color-sidebar: var(--color-neutral-950); --color-surface: #ffffff0d; }
      html, body, #root { margin: 0; width: 100%; height: 100%; }
      .bg-background { background-color: var(--color-background); }
      .bg-background-alt { background-color: var(--color-background-alt); border-radius: 10px; }
      .bg-sidebar { background-color: var(--color-sidebar); }
      #root { display: flex; color: #eef1f6; font: 14px/1.6 "Segoe UI", sans-serif; }
      .side { width: 200px; padding: 16px; }
      .main { flex: 1; padding: 20px; }
      .row { padding: 12px 16px; margin-bottom: 12px; max-width: 620px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="side bg-sidebar">侧栏(DSH 式玻璃)</div>
      <div class="main bg-background">
        <div class="row bg-background-alt">消息行 1 —— DSH 式玻璃条,壁纸全亮度</div>
        <div class="row bg-background-alt">消息行 2 —— 子任务状态更新</div>
        <div class="row bg-background-alt">消息行 3 —— 行级玻璃 + 全透主区</div>
      </div>
    </div>
  </body>
</html>
