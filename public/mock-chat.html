<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>模拟聊天窗口</title>
  <!-- 与真实补丁后的 index.html 相同的注入形态,但跨源(模拟 file:// 宿主) -->
  <link rel="stylesheet" href="http://127.0.0.1:7396/embed.css" />
  <script src="http://127.0.0.1:7396/embed.js" defer></script>
  <style>
    /* 复刻 ZCode token 结构 */
    :root { --color-neutral-900:#171717; --color-neutral-950:#0a0a0a; }
    .dark { --color-background: var(--color-neutral-900); }
    html, body, #root { margin: 0; width: 100%; height: 100%; }
    .bg-background { background-color: var(--color-background); }
    #root { color: #eef1f6; font: 14px/1.6 "Segoe UI", sans-serif; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 5; }
    .topbar button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 8px; background: rgba(127,127,127,.25); }
    .chat { position: fixed; top: 48px; bottom: 0; left: 0; right: 0; overflow: auto; padding: 24px; }
    /* 模拟设置页(默认隐藏) */
    #settings { position: fixed; inset: 0; display: none; z-index: 4; }
    #settings.open { display: flex; }
    .snav { width: 320px; background: rgba(10,12,16,.92); padding: 18px 12px; overflow: auto; }
    .snav .group { font-size: 11px; opacity: .5; margin: 14px 8px 6px; }
    .snav .item { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 9px; cursor: pointer; }
    .snav .item:hover { background: rgba(255,255,255,.08); }
    .snav .item.active { background: rgba(255,158,207,.15); }
    .scontent { flex: 1; padding: 28px 36px; }
  </style>
</head>
<body>
  <div id="root" class="bg-background">
    <div class="topbar">
      <button id="btn-open-settings">⚙ 设置</button>
      <span style="opacity:.6">模拟聊天窗口(跨源 7397)</span>
    </div>
    <div class="chat" id="chat-view">
      <div style="opacity:.65">聊天内容占位 —— 背景应为动态壁纸,可通过右下角 🖼 或设置里的 Wallpaper 打开工作台</div>
    </div>
    <div id="settings">
      <div class="snav">
        <div style="opacity:.6;padding:0 8px 4px">← 返回工作区</div>
        <div class="group">基础设置</div>
        <div class="item">⚙ 常规</div>
        <div class="item">🎨 外观</div>
        <div class="item">🧠 模型设置</div>
        <div class="group">Agent 能力</div>
        <div class="item">插件</div>
        <div class="item">技能</div>
      </div>
      <div class="scontent">
        <h2>外观</h2>
        <p style="opacity:.6">模拟设置内容。左侧应出现 Wallpaper 条目(在外观下方),点击打开工作台。</p>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('btn-open-settings').onclick = function () {
      document.getElementById('settings').classList.add('open');
      document.getElementById('chat-view').style.display = 'none';
    };
  </script>
</body>
</html>
